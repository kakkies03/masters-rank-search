name: ジャンボウデータ更新

on:
  schedule:
    - cron: "0 18 1 * *"   # 毎月2日 午前3時（日本時間）
  workflow_dispatch:
    inputs:
      years:
        description: "取得する年（例: 2025,2026）。空欄なら今年分（1〜3月は前年分も）"
        required: false
        default: ""
      max_pages:
        description: "お試し用：各区分で取得するページ数（0 = 全部取得してサイトに反映）"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: jambow-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 準備
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium

      - name: ジャンボウから取得
        run: python scraper/scrape.py --years "${{ github.event.inputs.years }}" --max-pages "${{ github.event.inputs.max_pages || 0 }}"

      - name: サイト用データに変換
        if: ${{ (github.event.inputs.max_pages || '0') == '0' }}
        run: python scraper/build.py

      - name: 変更を保存
        if: ${{ (github.event.inputs.max_pages || '0') == '0' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "データ更新 $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            git push
          fi

      - name: 取得結果・エラー時の画面を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-result
          path: |
            scraped/
            debug/
          if-no-files-found: ignore
          retention-days: 14
